<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 底座 -->
<rect x="26" y="73" width="52" height="6" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.5" stroke-width="1"/>
<!-- 机体（双圆） -->
<circle cx="42" cy="48" r="15" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.3"/>
<circle cx="60" cy="48" r="15" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.3"/>
<path d="M42 48 L60 48" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1"/>
<!-- 双叶轮 -->
<ellipse cx="42" cy="48" rx="5" ry="11" fill="none" stroke="#00F0FF" stroke-width="1.7" filter="url(#glow)"/>
<ellipse cx="60" cy="48" rx="5" ry="11" fill="none" stroke="#00F0FF" stroke-width="1.7" filter="url(#glow)"/>
<!-- 顶部出风管 -->
<rect x="46" y="19" width="10" height="16" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.7" stroke-width="1.2"/>
<rect x="42" y="16.5" width="18" height="4" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.7" stroke-width="1"/>
<!-- 出风气流 -->
<path d="M51 13 Q55 9 51 5" fill="none" stroke="#00F0FF" stroke-width="1.7" stroke-linecap="round" filter="url(#glow)"/>
<polygon points="51,4 47,8.5 55,8.5" fill="#00F0FF" filter="url(#glow)"/>
<!-- 电机（左） -->
<rect x="21" y="38" width="10" height="20" rx="3" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.7" stroke-width="1.2"/>
<line x1="21" y1="44" x2="21" y2="52" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1"/>
<!-- 进风口示意 -->
<path d="M27 30 Q24 34 27 38" fill="none" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>

</svg>
