<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 底座 -->
<rect x="30" y="74" width="42" height="6" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.5" stroke-width="1"/>
<!-- 进水管 -->
<rect x="14" y="45" width="12" height="10" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.65" stroke-width="1"/>
<path d="M12 50 L6 50" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
<!-- 蜗壳 -->
<circle cx="40" cy="50" r="15" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.3" filter="url(#glow)"/>
<path d="M32 42 Q27 50 33 58" fill="none" stroke="#9FFFFF" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round"/>
<!-- 出口管 -->
<path d="M47 35 L52 30 L57 35 L52 35 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.65" stroke-width="1"/>
<rect x="49" y="20" width="6" height="12" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.65" stroke-width="1"/>
<line x1="52" y1="18" x2="52" y2="14" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
<!-- 叶轮中心 -->
<circle cx="40" cy="50" r="4.5" fill="#00F0FF" filter="url(#glow)"/>
<!-- 电机 -->
<rect x="58" y="41" width="21" height="18" rx="4" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.2"/>
<line x1="62" y1="46" x2="75" y2="46" stroke="#9FFFFF" stroke-opacity="0.45" stroke-width="1"/>
<line x1="62" y1="51" x2="72" y2="51" stroke="#9FFFFF" stroke-opacity="0.25" stroke-width="1"/>
<!-- 旋转弧线 -->
<path d="M48 60 A12 12 0 0 1 42 62.5" fill="none" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" filter="url(#glow)"/>
<polygon points="42,62.5 47.5,61.5 45.5,66" fill="#00F0FF" filter="url(#glow)"/>

</svg>
