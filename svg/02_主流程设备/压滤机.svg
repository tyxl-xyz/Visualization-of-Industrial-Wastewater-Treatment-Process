<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 顶梁 -->
<rect x="20" y="19" width="60" height="5" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1"/>
<!-- 底部导轨 -->
<rect x="24" y="74" width="52" height="5" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.5" stroke-width="1"/>
<!-- 滤板排 -->
<rect x="24" y="27" width="7" height="46" rx="1" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<rect x="33" y="27" width="7" height="46" rx="1" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<rect x="42" y="27" width="7" height="46" rx="1" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<rect x="51" y="27" width="7" height="46" rx="1" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<!-- 板间缝隙 -->
<line x1="28" y1="27" x2="28" y2="73" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1"/>
<line x1="37" y1="27" x2="37" y2="73" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1"/>
<line x1="46" y1="27" x2="46" y2="73" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1"/>
<line x1="55" y1="27" x2="55" y2="73" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1"/>
<!-- 液压缸 -->
<rect x="63" y="29" width="13" height="42" rx="3" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.2" filter="url(#glow)"/>
<rect x="59" y="33" width="5" height="34" rx="2" fill="url(#gMain)"/>
<rect x="67" y="37" width="5" height="26" rx="2" fill="none" stroke="#9FFFFF" stroke-opacity="0.4" stroke-width="0.8"/>
<!-- 出液口 -->
<path d="M50 73 Q50 79 43 81" fill="none" stroke="#00F0FF" stroke-opacity="0.65" stroke-width="1.4" stroke-linecap="round"/>
<path d="M50 73 Q50 80 57 81" fill="none" stroke="#00F0FF" stroke-opacity="0.65" stroke-width="1.4" stroke-linecap="round"/>
<path d="M45 27 Q45 23 40 21" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/>

</svg>
