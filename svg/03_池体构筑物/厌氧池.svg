<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 池体 -->
<rect x="18" y="24" width="64" height="56" rx="6" fill="url(#gWater)" stroke="#7FF3FF" stroke-opacity="0.7" stroke-width="1.5"/>
<!-- 密闭顶盖 -->
<line x1="18" y1="24" x2="82" y2="24" stroke="#7FF3FF" stroke-opacity="0.8" stroke-width="1.5"/>
<!-- 三相分离器（人字形） -->
<path d="M50 30 L44 44 L56 44 Z" fill="url(#gBody)" fill-opacity="0.5" stroke="#00F0FF" stroke-opacity="0.8" stroke-width="1.3" filter="url(#glow)"/>
<circle cx="50" cy="36" r="1.5" fill="#9FFFFF" opacity="0.8"/>
<circle cx="50" cy="32" r="1" fill="#9FFFFF" opacity="0.6"/>
<!-- 集气管 -->
<rect x="47.5" y="17" width="5" height="9" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.65" stroke-width="1"/>
<path d="M50 15 Q50 11 54 9" fill="none" stroke="#00F0FF" stroke-width="1.4" stroke-linecap="round" filter="url(#glow)"/>
<polygon points="56,9 51,7.5 52.5,12" fill="#00F0FF" filter="url(#glow)"/>
<!-- 液面 -->
<path d="M22 44 Q30 42 40 44 T58 44 T78 44" fill="none" stroke="#9FFFFF" stroke-opacity="0.6" stroke-width="1.3"/>
<!-- 进水管 -->
<rect x="13" y="28" width="6" height="11" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.65" stroke-width="1"/>
<path d="M11 33 L5 33" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
<!-- 出水管 -->
<rect x="81" y="56" width="6" height="11" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.65" stroke-width="1"/>
<path d="M86 61 L92 61" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>

</svg>
