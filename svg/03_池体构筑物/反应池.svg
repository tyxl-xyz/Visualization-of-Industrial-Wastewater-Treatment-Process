<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 池体 -->
<rect x="18" y="24" width="64" height="56" rx="6" fill="url(#gWater)" stroke="#7FF3FF" stroke-opacity="0.7" stroke-width="1.5"/>
<!-- 液面 -->
<path d="M22 44 Q30 41 40 44 T58 44 T78 44" fill="none" stroke="#9FFFFF" stroke-opacity="0.75" stroke-width="1.5" filter="url(#glow)"/>
<!-- 顶置搅拌机 -->
<rect x="44" y="20" width="12" height="8" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.2"/>
<line x1="50" y1="28" x2="50" y2="52" stroke="url(#gMain)" stroke-width="2.2" stroke-linecap="round"/>
<path d="M44 46 L36 44 L44 48 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<path d="M56 46 L64 44 L56 48 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<path d="M44 58 L36 60 L44 56 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<path d="M56 58 L64 60 L56 56 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<!-- 加药管 -->
<line x1="70" y1="24" x2="70" y2="40" stroke="#00E5FF" stroke-opacity="0.65" stroke-width="1.4"/>
<circle cx="70" cy="42" r="2" fill="#00F0FF" filter="url(#glow)"/>
<line x1="70" y1="26" x2="76" y2="26" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.2"/>
<!-- 进水管 -->
<rect x="13" y="28" width="6" height="11" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.65" stroke-width="1"/>
<path d="M11 33 L5 33" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
<rect x="81" y="55" width="6" height="11" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.65" stroke-width="1"/>
<path d="M86 60 L92 60" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>

</svg>
