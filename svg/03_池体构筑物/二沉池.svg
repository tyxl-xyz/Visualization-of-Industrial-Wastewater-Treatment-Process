<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 池体 -->
<path d="M22 30 L78 30 L78 64 Q78 70 72 70 L28 70 Q22 70 22 64 Z" fill="url(#gWater)" stroke="#7FF3FF" stroke-opacity="0.7" stroke-width="1.5"/>
<!-- 中心导流筒 -->
<rect x="44" y="30" width="12" height="20" rx="2" fill="none" stroke="#00F0FF" stroke-opacity="0.75" stroke-width="1.3" filter="url(#glow)"/>
<!-- 中心进水管 -->
<rect x="47" y="14" width="6" height="18" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.6" stroke-width="1"/>
<path d="M50 12 L50 6" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
<!-- 液面 -->
<path d="M22 36 Q30 34 40 36 T58 36 T78 36" fill="none" stroke="#9FFFFF" stroke-opacity="0.7" stroke-width="1.4" filter="url(#glow)"/>
<!-- 刮泥机 -->
<line x1="30" y1="66" x2="70" y2="66" stroke="url(#gMain)" stroke-width="2" stroke-linecap="round"/>
<path d="M44 66 L44 71 L47 73" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M56 66 L56 71 L53 73" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<!-- 排泥 -->
<path d="M50 70 L50 76 L44 78" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.3" stroke-linecap="round"/>
<!-- 周边出水堰 -->
<path d="M22 30 L22 38" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" fill="none"/>
<rect x="15" y="34" width="5" height="9" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.65" stroke-width="1"/>
<path d="M13 38 L7 38" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>

</svg>
