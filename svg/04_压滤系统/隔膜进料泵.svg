<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 底座 -->
<rect x="26" y="76" width="48" height="6" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.5" stroke-width="1"/>
<!-- 泵体中部 -->
<rect x="38" y="42" width="24" height="18" rx="4" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.2" filter="url(#glow)"/>
<!-- 左右隔膜腔（圆形鼓膜） -->
<circle cx="31" cy="51" r="10" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.3"/>
<circle cx="31" cy="51" r="5.5" fill="none" stroke="#00F0FF" stroke-opacity="0.6" stroke-width="1.1" filter="url(#glow)"/>
<circle cx="69" cy="51" r="10" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.3"/>
<circle cx="69" cy="51" r="5.5" fill="none" stroke="#00F0FF" stroke-opacity="0.6" stroke-width="1.1" filter="url(#glow)"/>
<!-- 泵体铭牌线 -->
<line x1="43" y1="47" x2="57" y2="47" stroke="#9FFFFF" stroke-opacity="0.4" stroke-width="1"/>
<line x1="43" y1="54" x2="53" y2="54" stroke="#9FFFFF" stroke-opacity="0.25" stroke-width="1"/>
<!-- 顶部出料管 -->
<rect x="47" y="28" width="6" height="14" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.7" stroke-width="1"/>
<line x1="50" y1="25" x2="50" y2="20" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2"/>
<polygon points="50,18 46.5,22.5 53.5,22.5" fill="#00F0FF" opacity="0.8"/>
<!-- 底部进料管 -->
<rect x="47" y="60" width="6" height="14" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.7" stroke-width="1"/>
<line x1="50" y1="76" x2="50" y2="80" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.2"/>
<polygon points="50,82 46.5,77.5 53.5,77.5" fill="#00F0FF" opacity="0.8"/>

</svg>
