<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 顶梁 -->
<rect x="22" y="14" width="56" height="5" rx="2" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1"/>
<!-- 滤板排 -->
<rect x="26" y="22" width="7" height="24" rx="1" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<rect x="34" y="22" width="7" height="24" rx="1" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<rect x="42" y="22" width="7" height="24" rx="1" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<rect x="50" y="22" width="7" height="24" rx="1" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<!-- 板间缝隙 -->
<line x1="29.5" y1="22" x2="29.5" y2="46" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="0.8"/>
<line x1="37.5" y1="22" x2="37.5" y2="46" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="0.8"/>
<line x1="45.5" y1="22" x2="45.5" y2="46" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="0.8"/>
<line x1="53.5" y1="22" x2="53.5" y2="46" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="0.8"/>
<!-- 液压缸（右） -->
<rect x="61" y="24" width="10" height="20" rx="3" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.2" filter="url(#glow)"/>
<rect x="66" y="28" width="3" height="12" rx="1.5" fill="url(#gMain)"/>
<!-- 高压压榨水管（左侧接入，隔膜压榨特征） -->
<line x1="18" y1="18" x2="18" y2="40" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.4"/>
<path d="M18 18 L26 18" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.4"/>
<polygon points="17,38 13.5,33.5 20.5,33.5" fill="#00F0FF" opacity="0.7"/>
<!-- 高平台横梁 -->
<line x1="18" y1="50" x2="82" y2="50" stroke="url(#gMain)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
<!-- 平台支撑腿 -->
<line x1="24" y1="50" x2="24" y2="84" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.4"/>
<line x1="76" y1="50" x2="76" y2="84" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.4"/>
<!-- 平台斜撑加固 -->
<line x1="24" y1="50" x2="33" y2="58" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1"/>
<line x1="76" y1="50" x2="67" y2="58" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1"/>
<!-- 泥斗（倒梯形漏斗，接落料） -->
<path d="M34 52 L30 82 L70 82 L66 52 Z" fill="url(#gBody)" fill-opacity="0.3" stroke="#00F0FF" stroke-opacity="0.7" stroke-width="1.3" filter="url(#glow)"/>
<!-- 泥斗落料（泥饼） -->
<rect x="40" y="58" width="5" height="6" rx="1" fill="none" stroke="#9FFFFF" stroke-opacity="0.45" stroke-width="1"/>
<rect x="54" y="66" width="4" height="5" rx="1" fill="none" stroke="#9FFFFF" stroke-opacity="0.35" stroke-width="1"/>
<path d="M42 82 Q50 86 58 82" fill="none" stroke="#00C2E8" stroke-opacity="0.6" stroke-width="1.2"/>
<!-- 地面 -->
<line x1="18" y1="86" x2="82" y2="86" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 3"/>

</svg>
