<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 进气管 -->
<rect x="45.5" y="66" width="9" height="15" rx="3" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.6" stroke-width="1"/>
<line x1="50" y1="81" x2="50" y2="85" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.2"/>
<!-- 盘体（侧视扁椭圆） -->
<ellipse cx="50" cy="60" rx="20" ry="8.5" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.3" filter="url(#glow)"/>
<ellipse cx="50" cy="58" rx="15.5" ry="5" fill="none" stroke="#9FFFFF" stroke-opacity="0.5" stroke-width="0.8"/>
<!-- 微孔点 -->
<circle cx="44" cy="60" r="1" fill="#9FFFFF"/>
<circle cx="50" cy="60" r="1" fill="#9FFFFF"/>
<circle cx="56" cy="60" r="1" fill="#9FFFFF"/>
<circle cx="48" cy="56" r="0.8" fill="#9FFFFF" opacity="0.7"/>
<!-- 上升气泡 -->
<circle cx="41" cy="47" r="2.6" fill="none" stroke="#00F0FF" stroke-width="1.3" filter="url(#glow)"/>
<circle cx="53" cy="40" r="1.9" fill="none" stroke="#00F0FF" stroke-width="1.3" filter="url(#glow)"/>
<circle cx="59" cy="49" r="3" fill="none" stroke="#00F0FF" stroke-width="1.3" filter="url(#glow)"/>
<circle cx="46" cy="33" r="1.5" fill="#7FF3FF" opacity="0.85"/>
<circle cx="56" cy="28" r="1.1" fill="#7FF3FF" opacity="0.6"/>
<circle cx="38" cy="38" r="1.3" fill="#7FF3FF" opacity="0.7"/>
<!-- 顶部出气 -->
<line x1="50" y1="22" x2="50" y2="16" stroke="#00F0FF" stroke-opacity="0.6" stroke-width="1.5" filter="url(#glow)"/>
<polygon points="50,14 47,18.5 53,18.5" fill="#00F0FF" opacity="0.8" filter="url(#glow)"/>

</svg>
