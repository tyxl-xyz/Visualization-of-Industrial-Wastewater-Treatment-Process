<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 槽体 -->
<path d="M24 80 L24 72 Q24 67 30 67 L70 67 Q76 67 76 72 L76 80 Z" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="4 3"/>
<path d="M24 80 L24 72 Q24 67 30 67" fill="none" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="1.6" filter="url(#glow)"/>
<path d="M76 72 Q76 67 70 67 L76 67 Z" fill="none" stroke="#00E5FF" stroke-opacity="0.7" stroke-width="1.6" filter="url(#glow)"/>
<!-- 顶置电机 -->
<rect x="38" y="21" width="24" height="14" rx="3" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.8" stroke-width="1.2"/>
<rect x="36" y="18.5" width="28" height="4" rx="2" fill="url(#gMain)"/>
<!-- 散热鳍 -->
<line x1="44" y1="26" x2="56" y2="26" stroke="#9FFFFF" stroke-opacity="0.6" stroke-width="1"/>
<line x1="44" y1="30" x2="56" y2="30" stroke="#9FFFFF" stroke-opacity="0.35" stroke-width="1"/>
<!-- 联轴器 -->
<rect x="47" y="35" width="6" height="6" rx="1.5" fill="#00E5FF"/>
<!-- 搅拌轴 -->
<line x1="50" y1="41" x2="50" y2="63" stroke="url(#gMain)" stroke-width="2.8" stroke-linecap="round"/>
<!-- 上层桨叶 -->
<path d="M30 46 L46 44 L54 44 L70 46 L54 48 L46 48 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<circle cx="30" cy="46" r="1.5" fill="#9FFFFF"/>
<circle cx="70" cy="46" r="1.5" fill="#9FFFFF"/>
<!-- 下层桨叶 -->
<path d="M34 61 L47 59 L53 59 L66 61 L53 63 L47 63 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<circle cx="34" cy="61" r="1.5" fill="#9FFFFF"/>
<circle cx="66" cy="61" r="1.5" fill="#9FFFFF"/>
<!-- 旋转指示 -->
<path d="M78 50 A28 28 0 0 1 75 66" fill="none" stroke="#00F0FF" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)"/>
<polygon points="75,66 71.5,62 78,62.5" fill="#00F0FF" filter="url(#glow)"/>

</svg>
