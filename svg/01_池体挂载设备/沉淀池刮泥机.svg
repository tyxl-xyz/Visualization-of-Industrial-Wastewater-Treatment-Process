<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 池壁 -->
<circle cx="50" cy="50" r="31" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.6"/>
<circle cx="50" cy="50" r="31" fill="none" stroke="#00F0FF" stroke-opacity="0.16" stroke-width="7" filter="url(#soft)"/>
<circle cx="50" cy="50" r="26" fill="none" stroke="#00E5FF" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 4"/>
<!-- 中心驱动 -->
<circle cx="50" cy="50" r="7.5" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.2"/>
<circle cx="50" cy="50" r="3.2" fill="#00F0FF" filter="url(#glow)"/>
<!-- 刮臂主梁 -->
<line x1="17" y1="50" x2="83" y2="50" stroke="url(#gMain)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
<!-- 刮板（对称两对） -->
<path d="M24 50 L32 40 L37 44 L28 52 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<path d="M76 50 L68 40 L63 44 L72 52 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1"/>
<line x1="32" y1="60" x2="40" y2="66" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="2.2" stroke-linecap="round"/>
<line x1="68" y1="60" x2="60" y2="66" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="2.2" stroke-linecap="round"/>
<!-- 桥架细节 -->
<circle cx="36" cy="50" r="1.4" fill="#9FFFFF" opacity="0.7"/>
<circle cx="64" cy="50" r="1.4" fill="#9FFFFF" opacity="0.7"/>
<!-- 旋转方向 -->
<path d="M66 70 A23 23 0 0 1 50 74" fill="none" stroke="#00F0FF" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)"/>
<polygon points="50,74 56,72 54,78" fill="#00F0FF" filter="url(#glow)"/>

</svg>
