<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 表盘 -->
<circle cx="48" cy="39" r="18" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.85" stroke-width="1.4" filter="url(#glow)"/>
<circle cx="48" cy="39" r="14" fill="none" stroke="#9FFFFF" stroke-opacity="0.4" stroke-width="0.8"/>
<!-- 刻度 -->
<line x1="48" y1="25" x2="48" y2="29.5" stroke="#9FFFFF" stroke-opacity="0.9" stroke-width="1.5"/>
<line x1="60" y1="31" x2="57.5" y2="34.5" stroke="#9FFFFF" stroke-opacity="0.7" stroke-width="1.2"/>
<line x1="63" y1="43" x2="59" y2="43" stroke="#9FFFFF" stroke-opacity="0.7" stroke-width="1.2"/>
<line x1="55" y1="53" x2="52" y2="50" stroke="#9FFFFF" stroke-opacity="0.7" stroke-width="1.2"/>
<line x1="41" y1="51" x2="43" y2="48" stroke="#9FFFFF" stroke-opacity="0.5" stroke-width="1.2"/>
<!-- 指针 -->
<path d="M48 39 L54 28.5" stroke="url(#gMain)" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>
<circle cx="48" cy="39" r="2.6" fill="#00F0FF" filter="url(#glow)"/>
<!-- 玻璃反光 -->
<path d="M37 29 Q42 25 49 27" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.3" stroke-linecap="round"/>
<!-- 连接线 -->
<line x1="48" y1="57" x2="48" y2="63" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="1.4"/>
<!-- 探头 -->
<path d="M40 69 L56 69 L52 79 L44 79 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.75" stroke-width="1.2"/>
<circle cx="48" cy="75.5" r="2" fill="#00F0FF" filter="url(#glow)"/>
<!-- 数据线 -->
<line x1="48" y1="79" x2="48" y2="84" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1"/>

</svg>
