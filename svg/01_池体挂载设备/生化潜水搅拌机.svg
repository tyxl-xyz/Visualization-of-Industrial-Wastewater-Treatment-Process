<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10293B"/>
    <stop offset="1" stop-color="#071218"/>
  </linearGradient>
  <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00C2E8"/>
    <stop offset="0.55" stop-color="#007BA3"/>
    <stop offset="1" stop-color="#00445C"/>
  </linearGradient>
  <linearGradient id="gMain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9FFFFF"/>
    <stop offset="0.5" stop-color="#00F0FF"/>
    <stop offset="1" stop-color="#00A0C8"/>
  </linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7FF3FF" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#00A0C8" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>
<rect x="3" y="3" width="94" height="94" rx="16" fill="url(#bg)"/>
<rect x="3" y="3" width="94" height="94" rx="16" fill="none" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4" filter="url(#glow)"/>
<rect x="6.5" y="6.5" width="87" height="87" rx="12" fill="none" stroke="#7FF3FF" stroke-opacity="0.22" stroke-width="0.8"/>

<!-- 安装吊环 -->
<circle cx="40" cy="18" r="3.2" fill="none" stroke="#00F0FF" stroke-width="1.5" filter="url(#glow)"/>
<line x1="40" y1="21" x2="40" y2="38" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.4"/>
<!-- 流线主体 -->
<path d="M60 43 Q50 39 38 41 Q25 43 17 50 Q25 57 38 59 Q50 61 60 57 Z" fill="url(#gBody)" stroke="#7FF3FF" stroke-opacity="0.8" stroke-width="1.3"/>
<!-- 前导流锥头 -->
<path d="M17 50 L9 50 L13 45.5" fill="none" stroke="#00F0FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M17 50 L9 50 L13 54.5" fill="none" stroke="#00F0FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<!-- 主体铭牌线 -->
<line x1="30" y1="47" x2="52" y2="47" stroke="#9FFFFF" stroke-opacity="0.4" stroke-width="1"/>
<line x1="30" y1="52" x2="44" y2="52" stroke="#9FFFFF" stroke-opacity="0.22" stroke-width="1"/>
<circle cx="38" cy="50" r="1.6" fill="#00F0FF" filter="url(#glow)"/>
<!-- 尾部螺旋桨 -->
<path d="M60 50 Q67 38 75 33" fill="none" stroke="url(#gMain)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
<path d="M60 50 Q67 62 75 67" fill="none" stroke="url(#gMain)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
<circle cx="60" cy="50" r="3.4" fill="#00F0FF" filter="url(#glow)"/>
<line x1="75" y1="33" x2="79" y2="30" stroke="#9FFFFF" stroke-opacity="0.8" stroke-width="1.4" stroke-linecap="round"/>
<line x1="75" y1="67" x2="79" y2="70" stroke="#9FFFFF" stroke-opacity="0.8" stroke-width="1.4" stroke-linecap="round"/>
<!-- 水流线 -->
<path d="M82 45 Q86 50 82 55" fill="none" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/>
<path d="M86 43 Q91 50 86 57" fill="none" stroke="#00F0FF" stroke-opacity="0.75" stroke-width="1.2" stroke-linecap="round"/>
<polygon points="86,57 87.5,53 89.5,56" fill="#00F0FF" opacity="0.8"/>

</svg>
